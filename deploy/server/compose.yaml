# Production stack on the Raspberry Pi (D-117). Images are pulled from GHCR, never built here.
# Versions come from deploy/server/versions.env (gitignored), written by release.sh from each repo's
# latest published GitHub Release ("none" until the first one); migrations come from the backend submodule checked out at that tag.
#
#   cp deploy/server/.env.example deploy/server/.env   # set POSTGRES_PASSWORD and the keys
#   ./deploy/prod up -d                                # what release.sh runs after a new release
#
# Only `web` publishes a port: 127.0.0.1:${WEB_PORT:-8081} unless WEB_BIND names another address (opt-in).
# `db` and `api` are reachable only inside the compose network.
name: collections-app-prod

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Logs go to the systemd journal (docker logs still works); the logs service ships them (roadmap #25).
  logging:
    driver: journald

services:
  db:
    image: postgres:18.6-alpine3.24
    <<: *hardening
    # The entrypoint starts as root to prepare the data dir, then drops to the postgres user,
    # so it needs a few capabilities back. Everything else stays dropped.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: collection
      POSTGRES_DB: collection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/server/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection -d collection"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Runs once per `up`, applies pending migrations, exits. The api starts only after it succeeded.
  migrate:
    image: ghcr.io/0xfederama/collections-app-backend:${BACKEND_VERSION:-none}
    <<: *hardening
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://db:5432/collection?user=collection&password=${POSTGRES_PASSWORD:?}&sslmode=disable
    command: ["migrate"]
    restart: "no"

  api:
    image: ghcr.io/0xfederama/collections-app-backend:${BACKEND_VERSION:-none}
    <<: *hardening
    # Distroless image, user 65532 (nonroot). Only /data (the volume) is writable.
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://db:5432/collection?user=collection&password=${POSTGRES_PASSWORD:?}&sslmode=disable
      DATA_DIR: /data
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Collections}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OPENLIBRARY_CONTACT: ${OPENLIBRARY_CONTACT:-}
      HARDCOVER_API_KEY: ${HARDCOVER_API_KEY:-}
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Caddy: serves the SPA and proxies /api and /readyz to api:8080 (image: Q-03w, frontend-web/Dockerfile).
  web:
    image: ghcr.io/0xfederama/collections-app-frontend-web:${WEB_VERSION:-none}
    <<: *hardening
    # The image (D-072) runs as UID 10001 with the Caddy file capability removed, so no capability is needed.
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    ports:
      # WEB_BIND is the explicit opt-in for a LAN or Tailscale address (never 0.0.0.0, ./deploy/prod check refuses it).
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # Ships prod and collections-* unit logs to Grafana Cloud Loki (roadmap #25). Opt-in: COMPOSE_PROFILES=logs
  # plus LOKI_HOST/LOKI_USER/LOKI_TOKEN in deploy/server/.env. Capped at 48 MB of memory.
  logs:
    image: fluent/fluent-bit:5.1.4
    profiles: ["logs"]
    <<: *hardening
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }
    # Root, but with no capabilities: enough to read the journal files root owns, nothing else.
    user: "0"
    read_only: true
    mem_limit: 48m
    cpus: 0.25
    environment:
      LOKI_HOST: ${LOKI_HOST:-}
      LOKI_USER: ${LOKI_USER:-}
      LOKI_TOKEN: ${LOKI_TOKEN:-}
    volumes:
      - ./logs/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      # Parent dirs, so Docker never creates /var/log/journal (that would switch journald to persistent).
      - /var/log:/var/log:ro
      - /run/log:/run/log:ro
      - /etc/machine-id:/etc/machine-id:ro
      - logstate:/state
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  logstate:
