# Production stack for a home server (BACKUP_AND_DEPLOYMENT §5, D-069, D-071).
# Images are built here, on the server, from the submodules: no registry.
#
#   cp deploy/server/.env.example deploy/server/.env   # set POSTGRES_PASSWORD
#   ./deploy/prod up -d --build              # same as: docker compose -f deploy/server/compose.yaml up -d --build
#
# Only `web` publishes a port: 127.0.0.1:${WEB_PORT:-8081} unless WEB_BIND names another address (opt-in).
# `db` and `api` are reachable only inside the compose network.
name: collections-app-prod

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:18.6-alpine3.24
    <<: *hardening
    # The entrypoint starts as root to prepare the data dir, then drops to the postgres user,
    # so it needs a few capabilities back. Everything else stays dropped.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: collection
      POSTGRES_DB: collection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/server/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection -d collection"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Runs once per `up`, applies pending migrations, exits. The api starts only after it succeeded.
  migrate:
    image: migrate/migrate:v4.20.1
    <<: *hardening
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://db:5432/collection?user=collection&password=${POSTGRES_PASSWORD:?}&sslmode=disable
    volumes:
      - ../../backend/db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec migrate -path /migrations -database "$$DATABASE_URL" up']
    restart: "no"

  api:
    build: ../../backend
    <<: *hardening
    # Distroless image, user 65532 (nonroot). Only /data (the volume) is writable.
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://db:5432/collection?user=collection&password=${POSTGRES_PASSWORD:?}&sslmode=disable
      DATA_DIR: /data
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Our Collection}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OPENLIBRARY_CONTACT: ${OPENLIBRARY_CONTACT:-}
      OPENLIBRARY_DISABLED: ${OPENLIBRARY_DISABLED:-false}
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Caddy: serves the SPA and proxies /api and /readyz to api:8080 (image: Q-03w, frontend-web/Dockerfile).
  web:
    build: ../../frontend-web
    <<: *hardening
    # The image (D-072) runs as UID 10001 with the Caddy file capability removed, so no capability is needed.
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    ports:
      # WEB_BIND is the explicit opt-in for a LAN or Tailscale address (never 0.0.0.0, ./deploy/prod check refuses it).
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
