# Log shipping to Grafana Cloud Loki (roadmap #25). Fluent Bit reads the systemd journal: the prod containers
# (docker journald driver, see compose.yaml) and the collections-* units. Only the message line is sent,
# labelled by container or unit. Nothing else on the Pi changes; disable with COMPOSE_PROFILES unset.
[SERVICE]
    flush        10
    log_level    warn
    parsers_file /fluent-bit/etc/parsers.conf

[INPUT]
    name               systemd
    tag                journal
    db                 /state/journal.db
    read_from_tail     on
    strip_underscores  on
    systemd_filter_type or
    systemd_filter     CONTAINER_NAME=collections-app-prod-api-1
    systemd_filter     CONTAINER_NAME=collections-app-prod-web-1
    systemd_filter     CONTAINER_NAME=collections-app-prod-db-1
    systemd_filter     CONTAINER_NAME=collections-app-prod-migrate-1
    systemd_filter     _SYSTEMD_UNIT=collections-release.service
    systemd_filter     _SYSTEMD_UNIT=collections-backup.service
    systemd_filter     _SYSTEMD_UNIT=collections-health.service
    mem_buf_limit      2MB

# Keep only what is shipped: the line and where it came from.
[FILTER]
    name   record_modifier
    match  journal
    allowlist_key MESSAGE
    allowlist_key CONTAINER_NAME
    allowlist_key SYSTEMD_UNIT

[FILTER]
    name   modify
    match  journal
    rename CONTAINER_NAME container
    rename SYSTEMD_UNIT   unit

[OUTPUT]
    name            loki
    match           journal
    host            ${LOKI_HOST}
    port            443
    tls             on
    tls.verify      on
    http_user       ${LOKI_USER}
    http_passwd     ${LOKI_TOKEN}
    labels          job=collections, host=raspberrypi
    label_keys      $container, $unit
    remove_keys     container, unit
    drop_single_key raw
    line_format     key_value
    retry_limit     5
